name: Test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: python -m pip install -e ".[dev]"

      - name: lint
        run: |
          ruff check .
          ruff format --check .

      - name: type check
        run: mypy

      - name: test
        run: pytest -q
